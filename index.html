<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Магазин одягу</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e8ebee;
        --card: #f7f8f9;
        --ink: #17243a;
        --muted: #5d6b7e;
        --accent: #2c52f0;
        --accent-ink: #fff;
        --line: #c9d0d8;
        --off: #9aa5b3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 "Onest",
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        padding: 48px 0 24px;
      }
      h1 {
        font:
          700 clamp(28px, 6vw, 48px)/1.1 "Unbounded",
          sans-serif;
        margin: 0 0 10px;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 46ch;
      }
      .search {
        margin: 24px 0 8px;
      }
      .search input {
        width: 100%;
        max-width: 420px;
        padding: 12px 14px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        font: inherit;
        color: var(--ink);
      }
      .search input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .cats {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px 0 4px;
        scrollbar-width: none;
      }
      .cats::-webkit-scrollbar {
        display: none;
      }
      .cats button {
        flex: none;
        padding: 9px 16px;
        border: 1.5px solid var(--line);
        background: transparent;
        border-radius: 999px;
        font:
          500 15px "Onest",
          sans-serif;
        color: var(--ink);
        cursor: pointer;
      }
      .cats button[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .cats button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 22px;
        padding: 20px 0 64px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .photo {
        position: relative;
        aspect-ratio: 4/5;
        background: #d9dee4;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .photo .none {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--off);
        font-size: 14px;
      }
      .tag {
        position: absolute;
        top: 14px;
        right: 0;
        background: var(--ink);
        color: #fff;
        font:
          700 15px "Unbounded",
          sans-serif;
        padding: 8px 14px 8px 26px;
        border-radius: 999px 0 0 999px;
      }
      .tag::before {
        content: "";
        position: absolute;
        left: 10px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: var(--bg);
      }
      .body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .body h2 {
        font:
          600 17px/1.3 "Onest",
          sans-serif;
        margin: 0;
      }
      .body p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .sizes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sizes button {
        min-width: 40px;
        padding: 6px 10px;
        border: 1.5px solid var(--line);
        background: transparent;
        border-radius: 8px;
        font:
          500 14px "Onest",
          sans-serif;
        color: var(--ink);
        cursor: pointer;
      }
      .sizes button[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .order {
        margin-top: auto;
        display: block;
        text-align: center;
        text-decoration: none;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
      }
      .order:hover {
        filter: brightness(1.1);
      }
      .order:focus-visible,
      .sizes button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card.off .photo img {
        filter: grayscale(1);
        opacity: 0.6;
      }
      .card.off .order {
        background: var(--line);
        color: var(--muted);
        pointer-events: none;
      }
      .state {
        padding: 40px 0;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: no-preference) {
        .order {
          transition: filter 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 id="shopName"></h1>
        <p id="shopText"></p>
        <div class="search">
          <input
            id="q"
            type="search"
            placeholder="Знайти товар"
            aria-label="Знайти товар"
          />
        </div>
        <div id="cats" class="cats" role="group" aria-label="Розділи"></div>
      </header>
      <main id="grid" class="grid"></main>
      <div id="state" class="state"></div>
    </div>

    <script>
      /* ===== НАЛАШТУВАННЯ — міняти лише тут ===== */
      const CONFIG = {
        shopName: "Nazar Style",
        shopText: "Одяг у наявності. Обери розмір і напиши нам у Telegram.",
        telegram: "", // нікнейм без @, наприклад "my_shop"
        supabaseUrl: "https://weabeuhpmzsqxuexidgl.supabase.co",
        supabaseKey: "sb_publishable_Uvz6qmb6_bWFoabg5Mke4g_Dy8gqqIh",
      };

      /* Приклад товарів — показується, поки csvUrl порожній */
      const DEMO_CSV = `категорія,назва,ціна,розмір,наявність,фото,опис
      Худі,Худі oversize,1200,"S, M, L",так,,Щільний фліс
      Худі,Худі на змійці,1350,"M, L",так,,Бавовна
      Джинси,Джинси прямі,1500,"28, 30, 32",так,,Світло-блакитний деним
      Спортивні костюми,Костюм двійка,1900,"M, L, XL",так,,Сірий меланж
      Куртки,Куртка бомбер,2400,"M, L",ні,,Тимчасово немає`;

      const $ = (id) => document.getElementById(id);
      document.title = CONFIG.shopName;
      $("shopName").textContent = CONFIG.shopName;
      $("shopText").textContent = CONFIG.shopText;

      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                cell += '"';
                i++;
              } else q = false;
            } else cell += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell);
            cell = "";
            rows.push(row);
            row = [];
          } else cell += c;
        }
        if (cell !== "" || row.length) {
          row.push(cell);
          rows.push(row);
        }
        const head = rows.shift().map((h) => h.trim().toLowerCase());
        return rows
          .filter((r) => r.some((x) => x.trim()))
          .map((r) => {
            const o = {};
            head.forEach((h, i) => (o[h] = (r[i] || "").trim()));
            return o;
          });
      }

      function inStock(v) {
        v = (v || "").toLowerCase();
        if (["ні", "нема", "немає", "no", "0", "false"].includes(v))
          return false;
        return v !== "";
      }

      function el(tag, attrs = {}, text) {
        const e = document.createElement(tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function render(items) {
        const grid = $("grid");
        grid.replaceChildren();
        $("state").textContent = items.length
          ? ""
          : "Нічого не знайдено. Спробуй інший запит.";
        items.forEach((p) => {
          const ok = inStock(p["наявність"]);
          const card = el("article", { class: "card" + (ok ? "" : " off") });

          const photo = el("div", { class: "photo" });
          if (p["фото"]) {
            const img = el("img", {
              src: p["фото"],
              alt: p["назва"],
              loading: "lazy",
            });
            img.onerror = () => {
              img.remove();
              photo.prepend(el("div", { class: "none" }, "Фото скоро буде"));
            };
            photo.append(img);
          } else photo.append(el("div", { class: "none" }, "Фото скоро буде"));
          if (p["ціна"])
            photo.append(el("div", { class: "tag" }, p["ціна"] + " грн"));

          const body = el("div", { class: "body" });
          body.append(el("h2", {}, p["назва"]));
          if (p["опис"]) body.append(el("p", {}, p["опис"]));

          let size = "";
          const sizes = (p["розмір"] || "")
            .split(/[,;/]/)
            .map((s) => s.trim())
            .filter(Boolean);
          const link = el(
            "a",
            { class: "order", target: "_blank", rel: "noopener" },
            ok ? "Замовити в Telegram" : "Немає в наявності",
          );
          const setLink = () => {
            const msg =
              `Привіт! Хочу замовити: ${p["назва"]}` +
              (size ? `, розмір ${size}` : "");
            link.href = CONFIG.telegram
              ? `https://t.me/${CONFIG.telegram}?text=${encodeURIComponent(msg)}`
              : "#";
          };
          if (sizes.length) {
            const box = el("div", {
              class: "sizes",
              role: "group",
              "aria-label": "Розмір",
            });
            sizes.forEach((s) => {
              const b = el(
                "button",
                { type: "button", "aria-pressed": "false" },
                s,
              );
              b.onclick = () => {
                size = size === s ? "" : s;
                box
                  .querySelectorAll("button")
                  .forEach((x) =>
                    x.setAttribute(
                      "aria-pressed",
                      String(x.textContent === size),
                    ),
                  );
                setLink();
              };
              box.append(b);
            });
            body.append(box);
          }
          setLink();
          body.append(link);
          card.append(photo, body);
          grid.append(card);
        });
      }

      (async function () {
        let items;
        try {
          let items0;
          const norm = (s) => {
            s = (s || "").replace(/\s+/g, " ").trim();
            return s
              ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()
              : "";
          };
          if (CONFIG.supabaseUrl) {
            const res = await fetch(
              CONFIG.supabaseUrl +
                "/rest/v1/products?select=*&order=created_at.desc",
              { headers: { apikey: CONFIG.supabaseKey } },
            );
            if (!res.ok) throw new Error(res.status);
            items0 = (await res.json()).map((r) => ({
              категорія: r.category || "",
              назва: r.name,
              ціна: r.price == null ? "" : String(r.price),
              розмір: r.sizes || "",
              наявність: r.in_stock ? "так" : "ні",
              фото: r.photo || "",
              опис: r.description || "",
            }));
          } else items0 = parseCSV(DEMO_CSV);
          items = items0.filter((p) => p["назва"]);
          items.forEach((p) => {
            p["категорія"] = norm(p["категорія"]);
          });
        } catch (e) {
          $("state").textContent =
            "Не вдалося завантажити товари. Спробуй оновити сторінку.";
          return;
        }
        let cat = "",
          term = "";
        const cats = [
          ...new Set(items.map((p) => p["категорія"]).filter(Boolean)),
        ];
        const catBox = $("cats");
        function apply() {
          render(
            items.filter(
              (p) =>
                (!cat || p["категорія"] === cat) &&
                (p["назва"] + " " + p["опис"]).toLowerCase().includes(term),
            ),
          );
          catBox
            .querySelectorAll("button")
            .forEach((b) =>
              b.setAttribute("aria-pressed", String(b.dataset.cat === cat)),
            );
        }
        if (cats.length) {
          ["", ...cats].forEach((c) => {
            const b = el(
              "button",
              { type: "button", "aria-pressed": "false", "data-cat": c },
              c || "Усі",
            );
            b.onclick = () => {
              cat = c;
              apply();
            };
            catBox.append(b);
          });
        }
        $("q").addEventListener("input", (e) => {
          term = e.target.value.trim().toLowerCase();
          apply();
        });
        apply();
      })();
    </script>
  </body>
</html>
