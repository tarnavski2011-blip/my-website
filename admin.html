<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Адмінка</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --bg: #e8ebee;
        --card: #f7f8f9;
        --ink: #17243a;
        --muted: #5d6b7e;
        --accent: #2c52f0;
        --line: #c9d0d8;
        --bad: #c62828;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      .box {
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        font: inherit;
        background: #fff;
        color: var(--ink);
      }
      textarea {
        min-height: 70px;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * {
        flex: 1;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .check input {
        width: auto;
      }
      button {
        padding: 11px 16px;
        border: 0;
        border-radius: 10px;
        font: 600 15px system-ui;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button.sec {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--line);
      }
      button.del {
        background: transparent;
        color: var(--bad);
        border: 1.5px solid var(--bad);
      }
      button:disabled {
        opacity: 0.5;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .item {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .item:first-child {
        border-top: 0;
      }
      .item img,
      .item .ph {
        width: 56px;
        height: 70px;
        object-fit: cover;
        border-radius: 8px;
        background: #d9dee4;
        flex: none;
      }
      .item .info {
        flex: 1;
        min-width: 0;
      }
      .item b {
        display: block;
      }
      .item small {
        color: var(--muted);
      }
      .off {
        opacity: 0.55;
      }
      .err {
        color: var(--bad);
        font-size: 14px;
        min-height: 20px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="login" class="box" hidden>
        <h1>Вхід</h1>
        <form id="loginForm">
          <label for="email">Email</label
          ><input id="email" type="email" autocomplete="username" required />
          <label for="pass">Пароль</label
          ><input
            id="pass"
            type="password"
            autocomplete="current-password"
            required
          />
          <div class="err" id="loginErr"></div>
          <div class="actions"><button>Увійти</button></div>
        </form>
      </div>

      <div id="app" hidden>
        <div class="top">
          <h1>Товари</h1>
          <button class="sec" id="logout">Вийти</button>
        </div>

        <form id="form" class="box">
          <b id="formTitle">Новий товар</b>
          <label for="name">Назва</label><input id="name" required />
          <div class="row">
            <div>
              <label for="cat">Розділ</label
              ><input
                id="cat"
                list="cats"
                placeholder="Худі"
                autocomplete="off"
              /><datalist id="cats"></datalist>
            </div>
            <div>
              <label for="price">Ціна, Kč</label
              ><input
                id="price"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
              />
            </div>
          </div>
          <label for="sizes">Розміри через кому</label
          ><input id="sizes" placeholder="S, M, L" />
          <label for="desc">Опис</label><textarea id="desc"></textarea>
          <label for="photo">Фото</label
          ><input id="photo" type="file" accept="image/*" />
          <div id="photoNote" class="err" style="color: var(--muted)"></div>
          <label class="check"
            ><input id="stock" type="checkbox" checked /> Є в наявності</label
          >
          <div class="err" id="formErr"></div>
          <div class="actions">
            <button id="save">Зберегти</button>
            <button type="button" class="sec" id="cancel" hidden>
              Скасувати
            </button>
          </div>
        </form>

        <div id="list" class="box"></div>
      </div>
    </div>

    <script>
      /* ===== НАЛАШТУВАННЯ: ті самі дані, що й у index.html ===== */
      const SUPABASE_URL = "sb_publishable_Uvz6qmb6_bWFoabg5Mke4g_Dy8gqqIh";
      const SUPABASE_KEY = "sb_secret_Cn6_VsPQMmQxbc64LtTRFg_IqMA-NaQ";

      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const $ = (id) => document.getElementById(id);
      let items = [],
        editId = null,
        oldPhoto = "";

      const norm = (s) => {
        s = (s || "").replace(/\s+/g, " ").trim();
        return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : "";
      };

      function show(on) {
        $("login").hidden = on;
        $("app").hidden = !on;
        if (on) load();
      }
      db.auth.getSession().then(({ data }) => show(!!data.session));

      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await db.auth.signInWithPassword({
          email: $("email").value,
          password: $("pass").value,
        });
        if (error) $("loginErr").textContent = "Невірний email або пароль";
        else show(true);
      };
      $("logout").onclick = async () => {
        await db.auth.signOut();
        show(false);
      };

      async function load() {
        const { data, error } = await db
          .from("products")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          alert("Помилка: " + error.message);
          return;
        }
        items = data;
        renderList();
        const cats = [...new Set(items.map((p) => p.category).filter(Boolean))];
        $("cats").replaceChildren(
          ...cats.map((c) => {
            const o = document.createElement("option");
            o.value = c;
            return o;
          }),
        );
      }

      function renderList() {
        const box = $("list");
        box.replaceChildren();
        if (!items.length) {
          box.textContent = "Товарів ще немає.";
          return;
        }
        items.forEach((p) => {
          const row = document.createElement("div");
          row.className = "item" + (p.in_stock ? "" : " off");
          let img;
          if (p.photo) {
            img = document.createElement("img");
            img.src = p.photo;
            img.alt = "";
          } else {
            img = document.createElement("div");
            img.className = "ph";
          }
          const info = document.createElement("div");
          info.className = "info";
          const b = document.createElement("b");
          b.textContent = p.name;
          const s = document.createElement("small");
          s.textContent = [
            p.category,
            p.price != null ? p.price + " Kč" : "",
            p.sizes,
            p.in_stock ? "є" : "немає",
          ]
            .filter(Boolean)
            .join(" · ");
          info.append(b, s);
          const edit = document.createElement("button");
          edit.className = "sec";
          edit.textContent = "Змінити";
          edit.onclick = () => startEdit(p);
          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "×";
          del.setAttribute("aria-label", "Видалити");
          del.onclick = async () => {
            if (!confirm("Видалити «" + p.name + "»?")) return;
            await db.from("products").delete().eq("id", p.id);
            load();
          };
          row.append(img, info, edit, del);
          box.append(row);
        });
      }

      function startEdit(p) {
        editId = p.id;
        oldPhoto = p.photo || "";
        $("formTitle").textContent = "Редагування";
        $("name").value = p.name;
        $("cat").value = p.category || "";
        $("price").value = p.price ?? "";
        $("sizes").value = p.sizes || "";
        $("desc").value = p.description || "";
        $("stock").checked = p.in_stock;
        $("photo").value = "";
        $("photoNote").textContent = p.photo
          ? "Фото вже є. Вибери нове, щоб замінити."
          : "";
        $("cancel").hidden = false;
        scrollTo({ top: 0, behavior: "smooth" });
      }
      function reset() {
        editId = null;
        oldPhoto = "";
        $("form").reset();
        $("stock").checked = true;
        $("formTitle").textContent = "Новий товар";
        $("photoNote").textContent = "";
        $("cancel").hidden = true;
      }
      $("cancel").onclick = reset;

      async function compress(file) {
        const bmp = await createImageBitmap(file);
        const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k);
        c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        return new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
      }

      $("form").onsubmit = async (e) => {
        e.preventDefault();
        $("formErr").textContent = "";
        $("save").disabled = true;
        try {
          let photo = oldPhoto;
          const f = $("photo").files[0];
          if (f) {
            const blob = await compress(f),
              name = Date.now() + ".jpg";
            const up = await db.storage
              .from("photos")
              .upload(name, blob, { contentType: "image/jpeg" });
            if (up.error) throw up.error;
            photo = db.storage.from("photos").getPublicUrl(name).data.publicUrl;
          }
          const row = {
            name: $("name").value.trim(),
            category: norm($("cat").value) || null,
            price: $("price").value === "" ? null : Number($("price").value),
            sizes:
              $("sizes")
                .value.replace(/\s*,\s*/g, ", ")
                .trim() || null,
            description: $("desc").value.trim() || null,
            in_stock: $("stock").checked,
            photo: photo || null,
          };
          const q = editId
            ? db.from("products").update(row).eq("id", editId)
            : db.from("products").insert(row);
          const { error } = await q;
          if (error) throw error;
          reset();
          load();
        } catch (err) {
          $("formErr").textContent =
            "Не вдалося зберегти: " + (err.message || err);
        }
        $("save").disabled = false;
      };
    </script>
  </body>
</html>
